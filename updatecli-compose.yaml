# Config file for `updatecli compose ...`.
# https://www.updatecli.io/docs/core/compose/
policies:
  # updatecli clones the repository once, with the first policy's SCM settings,
  # so keep a policy that honors scm.submodules first.
  - name: Handle default oblt-cli version
    policy: ghcr.io/elastic/oblt-updatecli-policies/oblt-cli/version:0.5.1@sha256:5ce84254a72171f233b8bd77bbf1f3e20566aefeb3db4cdaad12dcc6abac3a4a
    values:
      - .ci/updatecli/values.d/scm.yml
      - .ci/updatecli/values.d/oblt-cli.yml
  - name: Handle ironbank bumps
    policy: ghcr.io/elastic/oblt-updatecli-policies/ironbank/templates:1.2.0@sha256:ba973b3ce729e88fb4b8900e104463f8c512f94429a7a422d2089f9089e70080
    values:
      - .ci/updatecli/values.d/scm.yml
      - .ci/updatecli/values.d/ironbank.yml
  - name: Update Updatecli policies
    policy: ghcr.io/updatecli/policies/autodiscovery/updatecli:0.11.1@sha256:de145eea3f42312f4d1fdedb562adc36adcd54d7568f230ae71f931cc5288321
    values:
      - .ci/updatecli/values.d/scm.yml
      - .ci/updatecli/values.d/updatecli-compose.yml
