kind: bug-fix

summary: Fix FIPS build of the verifier receiver after consolidating Identity Federation auth

description: >
  The beats Azure identity federation package is excluded from FIPS builds
  (build tag !requirefips), so the Azure verifier no longer compiled with
  requirefips. Azure identity federation is now compiled out of FIPS builds of
  the verifier receiver; the Azure verifier reports itself as not configured
  there.

component: elastic-agent
