kind: enhancement

summary: Trust custom CAs in browser monitors

description: >
  The agent imports the PEM certificates (including bundles) listed in the new
  agent.synthetics.browser.certificate_authorities setting, as files or as
  directories of .crt and .pem files, into the NSS database that Chromium uses.
  It does it at startup and again while running when they change, as set by
  agent.synthetics.browser.certificate_reload (enabled by default, every 30s).
  Browser monitors can then reach endpoints signed by an internal CA without
  building a custom image or ignoring TLS errors. Only the browser trusts them:
  the trust store of the operating system is unchanged. In containers
  ELASTIC_AGENT_BROWSER_CA sets the paths and ELASTIC_AGENT_BROWSER_CA_RELOAD_INTERVAL
  the interval (0 disables it). The complete images ship certutil (nss-tools /
  libnss-tools) for this. The Helm chart gains `agent.browserCAs.secretName` to
  mount a Secret with the CAs at /etc/elastic-agent/browser-cas and set
  ELASTIC_AGENT_BROWSER_CA to it.

component: elastic-agent

issue: https://github.com/elastic/elastic-agent/issues/6633
