# REQUIRED
# Kind can be one of:
# - breaking-change: a change to previously-documented behavior
# - deprecation: functionality that is being removed in a later release
# - bug-fix: fixes a problem in a previous version
# - enhancement: extends functionality but does not break or fix existing behavior
# - feature: new functionality
# - known-issue: problems that we are aware of in a given version
# - security: impacts on the security of a product or a user’s deployment.
# - upgrade: important information for someone upgrading from a prior version
# - other: does not fit into any of the other categories
kind: enhancement

# REQUIRED for all kinds
# Change summary; a 80ish characters long description of the change.
summary: Collect Kubernetes container logs with a single filestream input

# REQUIRED for breaking-change, deprecation, known-issue
# Long description; in case the summary is not enough to describe the change
# this field accommodate a description without length limits.
description: >
  The kubernetes.container_logs integration previously rendered one filestream
  input per discovered container, because its paths, ids and processors are
  templated with ${kubernetes.*} variable references. Every pod event re-rendered
  the component model and reconfigured Filebeat.

  Those references are now stripped before the policy is rendered, so the
  integration collapses into a single filestream watching a glob path, and an
  add_kubernetes_metadata processor supplies the Kubernetes metadata the dynamic
  provider used to inject. New pods are picked up by the existing file scanner
  with no reconfiguration.

  Hints-based autodiscovery inputs and any input carrying a condition are left
  per-container, as before. Set
  ELASTIC_AGENT_KUBERNETES_CONTAINER_LOGS_GLOB=false, or
  agent.internal.kubernetes.container_logs_glob_input to false in the policy, to
  restore the previous behaviour.

# REQUIRED for breaking-change, deprecation, known-issue
# impact:

# REQUIRED for breaking-change, deprecation, known-issue
# action:

# REQUIRED for all kinds
# Affected component; usually one of "elastic-agent", "fleet-server", "filebeat", "metricbeat", "auditbeat", "all", etc.
component: elastic-agent

