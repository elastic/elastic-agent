      summary: Keep Elastic Agent logs in data/logs/<build> instead of data/elastic-agent-<build>/logs, so they are retained on upgrade failure
      description: The internal logs of the Agent, which diagnostics collects, are now written to data/logs/<build> instead of the logs directory of the installation directory (data/elastic-agent-<build>/logs). Both are inside the installation directory of the Agent, but the new one is not removed with an old build. The logs of the running build and of the latest previous build are kept. Tools that read the logs from the versioned directory need the new path.
