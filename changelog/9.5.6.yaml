    - kind: bug-fix
      summary: Fix Elasticsearch output parameters sending all data to the first host when running beats as OTel receivers
      description: |
        When an Elasticsearch output with several hosts set `parameters`, every exporter endpoint was replaced with the
        first host, so all data was sent to that host and the others were never used.
      component: elastic-agent
      pr:
        - https://github.com/elastic/elastic-agent/pull/16937
      issue: []
      impact: ""
      action: ""
      timestamp: 1790837054
      file:
        name: 1790837054-fix-elasticsearch-parameters-dropping-all-but-the-first-host.yaml
        checksum: e51393bf14bad37ac6d9f392992d961999154ef1
    - kind: bug-fix
      summary: Fix variables in Fleet policy inputs and outputs being resolved too early outside of the main agent process
      description: |
        When loading the full agent configuration, the Fleet policy was merged without protecting inputs and outputs
        from go-ucfg variable expansion. Variables referencing values present in the agent's own configuration
        (`agent.*`, `host.id`, `path.*`, `runtime.*`) were substituted as unquoted text before the transpiler
        evaluated them. This broke `elastic-agent uninstall`, `elastic-agent inspect`, and switching between
        privileged and unprivileged mode for policies using such variables, for example the
        `${agent.id} == '<id>'` input conditions that Synthetics private locations assign to agents.
      component: elastic-agent
      pr:
        - https://github.com/elastic/elastic-agent/pull/16972
      issue: []
      impact: ""
      action: ""
      timestamp: 1790940000
      file:
        name: 1790940000-fix-early-resolution-of-policy-input-variables.yaml
        checksum: 73c916f2eaf4637a25ecbdb9b9ede3c16770168f
    - kind: bug-fix
      summary: Fleet client is rebuilt when only TLS/CA settings change in a policy
      description: |
        A policy change that only added or rotated a Fleet Server CA
        (`ssl.agent_certificate_authorities`) with the Fleet hosts list unchanged was
        silently ignored for already-enrolled agents, which kept trusting only their
        original enrollment CA. If Fleet Server then rotated its serving certificate
        to the new CA, those agents went offline with an x509 "certificate signed by
        unknown authority" error. The Fleet client is now rebuilt whenever the
        policy's TLS certificate or CAs change, even if the Fleet hosts stay the same.
      component: elastic-agent
      pr:
        - https://github.com/elastic/elastic-agent/pull/17014
      issue: []
      impact: ""
      action: ""
      timestamp: 1791213566
      file:
        name: 1791213566-fleet-client-rebuilt-on-ca-only-policy-change.yaml
        checksum: 8e858c6e36235be1ac071f2d7bcc3df5c0474854
    - kind: bug-fix
      summary: Fix EDOT collector hanging on shutdown when a component fails to start
      description: |
        The elasticmonitoring receiver waited on a channel that was only closed by the goroutine launched in `Start` causing it to hang on shutdown when a component failed to start.
      component: elastic-agent
