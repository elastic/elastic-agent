# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# Spike for observability-robots#5246 (ingest-dev#3042, phase A): probe what Orka macOS VMs offer.
#
# Orka images have no git mirror (/opt/git-mirrors) and BUILDKITE_GIT_CLONE_FLAGS from the pipeline env is
# not honored there, so the default checkout is a full ~500 MiB clone that takes minutes. Skip it and fetch
# only the commit under test.
env:
  # Same values as integration.pipeline.yml
  IMAGE_UBUNTU_2204_ARM_64: "platform-ingest-elastic-agent-ubuntu-2204-aarch64-1789434098"

common:
  - google_oidc_plugin: &google_oidc_plugin
      elastic/oblt-google-auth#v1.3.1:
        lifetime: 10800 # seconds
        project-id: "elastic-observability-ci"
        project-number: "911195782929"
  - google_oidc_observability_plugin: &google_oidc_observability_plugin
      elastic/oblt-google-auth#v1.3.1:
        lifetime: 10800 # seconds
  - oblt_cli_plugin: &oblt_cli_plugin
      elastic/oblt-cli#v0.4.2:
        version-file: .oblt-cli-version
  - vault_github_token: &vault_github_token
      elastic/vault-github-token#v0.2.1:
  - shallow_checkout: &shallow_checkout |
      set -euo pipefail
      echo "~~~ Shallow checkout of $${BUILDKITE_COMMIT}"
      start=$$(date +%s)
      mkdir -p src && cd src
      git init -q
      git remote add origin https://github.com/elastic/elastic-agent.git
      git fetch -q --depth 1 origin "$${BUILDKITE_COMMIT}"
      git checkout -q FETCH_HEAD
      echo "checkout seconds: $$(( $$(date +%s) - start ))"

steps:
  - group: "Orka macOS probe"
    if: build.env("MACOS_SMOKE") != "true"
    steps:
      - label: "probe macos 15 arm64 (generic-base-15-arm-002)"
        env:
          BUILDKITE_SKIP_CHECKOUT: "true"
          BUILDKITE_GIT_SUBMODULES: "false"
        command:
          - *shallow_checkout
          - .buildkite/scripts/macos_probe.sh
        agents:
          provider: orka
          imagePrefix: generic-base-15-arm-002
        timeout_in_minutes: 30

      - label: "probe macos 27 arm64 (endpoint-macos-27-arm)"
        env:
          BUILDKITE_SKIP_CHECKOUT: "true"
          BUILDKITE_GIT_SUBMODULES: "false"
        soft_fail: true
        command:
          - *shallow_checkout
          - .buildkite/scripts/macos_probe.sh
        agents:
          provider: orka
          imagePrefix: endpoint-macos-27-arm
        timeout_in_minutes: 30

  # Smoke ITs on macOS (enroll + standalone upgrade against an ESS stack). Run with MACOS_SMOKE=true.
  - group: "Orka macOS smoke ITs"
    if: build.env("MACOS_SMOKE") == "true"
    steps:
      - label: ":package: darwin/arm64: tar.gz"
        key: packaging-darwin-arm64
        env:
          PLATFORMS: "darwin/arm64"
          PACKAGES: "tar.gz"
        command: ".buildkite/scripts/steps/integration-package.sh"
        artifact_paths:
          - build/distributions/**
        agents:
          # the darwin/arm64 golang-crossbuild image only runs on arm64 hosts
          provider: "aws"
          instanceType: "c6g.2xlarge"
          image: "${IMAGE_UBUNTU_2204_ARM_64}"
        plugins:
          - *google_oidc_plugin

      - label: "Start ESS stack"
        key: macos-smoke-ess
        env:
          # wave 1 runs 9 groups, 2 at a time: keep the stack longer than the 4h default
          ESS_EXPIRE_HOURS: "10"
        command: .buildkite/scripts/steps/ess_start_oblt-cli.sh
        agents:
          image: "docker.elastic.co/ci-agent-images/platform-ingest/buildkite-agent-beats-ci-with-hooks:0.5"
          useCustomGlobalHooks: true
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token

      # Wave 1: groups without special privileges. At most 2 Orka VMs at a time.
      - label: "macos 27 arm64: {{matrix}}"
        key: macos-wave1
        matrix:
          - default
          - fleet
          - fleet-privileged
          - install-uninstall
          - upgrade
          - upgrade-flavor
          - upgrade-rollback
          - fleet-upgrade
          - fleet-proxy
        depends_on: [packaging-darwin-arm64, macos-smoke-ess]
        soft_fail: true
        concurrency: 2
        concurrency_group: "elastic-agent-macos-integration/orka-wave1"
        env:
          TEST_PACKAGE: "github.com/elastic/elastic-agent/testing/integration/ess"
        command: .buildkite/scripts/macos_smoke.sh {{matrix}}
        artifact_paths:
          - build/**
        agents:
          provider: orka
          imagePrefix: endpoint-macos-27-arm
        timeout_in_minutes: 120
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token

      - label: "ESS stack cleanup"
        depends_on: [macos-wave1]
        allow_dependency_failure: true
        command: .buildkite/scripts/steps/ess_cleanup_all.sh
        agents:
          image: "docker.elastic.co/ci-agent-images/platform-ingest/buildkite-agent-beats-ci-with-hooks:0.5"
          useCustomGlobalHooks: true
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
