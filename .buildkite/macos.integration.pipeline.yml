# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# Integration tests on macOS (Orka VMs, Endpoint team image) against an ESS stack. Trigger manually, e.g.:
#   bk build create --pipeline elastic/elastic-agent-macos-integration --branch <branch> --commit HEAD
env:
  # Same value as pipeline.yml
  IMAGE_UBUNTU_2204_ARM_64: "platform-ingest-elastic-agent-ubuntu-2204-aarch64-1791307568"

common:
  - google_oidc_plugin: &google_oidc_plugin
      elastic/oblt-google-auth#v1.3.5:
        lifetime: 10800 # seconds
        project-id: "elastic-observability-ci"
        project-number: "911195782929"
  - google_oidc_observability_plugin: &google_oidc_observability_plugin
      elastic/oblt-google-auth#v1.3.5:
        lifetime: 10800 # seconds
  - oblt_cli_plugin: &oblt_cli_plugin
      elastic/oblt-cli#v0.4.5:
        version-file: .oblt-cli-version
  - vault_github_token: &vault_github_token
      elastic/vault-github-token#v0.2.3:

steps:
  - group: "Orka macOS ITs"
    steps:
      - label: ":package: darwin/arm64: tar.gz"
        key: packaging-darwin-arm64
        env:
          PLATFORMS: "darwin/arm64"
          PACKAGES: "tar.gz"
        command: ".buildkite/scripts/steps/integration-package.sh"
        artifact_paths:
          - build/distributions/**
        agents:
          # the darwin/arm64 golang-crossbuild image only runs on arm64 hosts
          provider: "aws"
          instanceType: "c6g.2xlarge"
          image: "${IMAGE_UBUNTU_2204_ARM_64}"
        plugins:
          - *google_oidc_plugin

      - label: "Start ESS stack"
        key: macos-ess
        env:
          # the matrix runs 9 groups, 2 at a time: keep the stack longer than the 4h default
          ESS_EXPIRE_HOURS: "10"
          ESS_PUBLISH_ENV: "true"
        command: .buildkite/scripts/steps/ess_start_oblt-cli.sh
        agents:
          image: "docker.elastic.co/ci-agent-images/platform-ingest/buildkite-agent-beats-ci-with-hooks:0.5"
          useCustomGlobalHooks: true
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token

      # Groups without special privileges. At most 2 Orka VMs at a time.
      - label: "macos 27 arm64: {{matrix}}"
        key: macos-tests
        matrix:
          - default
          - fleet
          - fleet-privileged
          - install-uninstall
          - upgrade
          - upgrade-flavor
          - upgrade-rollback
          - fleet-upgrade
          - fleet-proxy
        depends_on: [packaging-darwin-arm64, macos-ess]
        soft_fail: true
        concurrency: 2
        concurrency_group: "elastic-agent-macos-integration/orka-macos"
        env:
          TEST_PACKAGE: "github.com/elastic/elastic-agent/testing/integration/ess"
        command: .buildkite/scripts/macos_tests.sh {{matrix}}
        artifact_paths:
          - build/**
        agents:
          provider: orka
          imagePrefix: endpoint-macos-27-arm
        timeout_in_minutes: 120
        plugins:
          # no oblt-cli / vault-github-token plugins here: their GitHub token expires during the long Orka clone
          - *google_oidc_observability_plugin

      - label: "ESS stack cleanup"
        depends_on: [macos-tests]
        allow_dependency_failure: true
        command: .buildkite/scripts/steps/ess_cleanup_all.sh
        agents:
          image: "docker.elastic.co/ci-agent-images/platform-ingest/buildkite-agent-beats-ci-with-hooks:0.5"
          useCustomGlobalHooks: true
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
