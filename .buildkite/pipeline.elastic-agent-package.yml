# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
env:
  # this is required in order to allow the build process to override the default PWD of the BEAT_NAME.
  BEAT_NAME: "elastic-agent"
  # after moving elastic-agent out of beats, we should update the URL of the packaging.
  BEAT_URL: "https://www.elastic.co/elastic-agent"

  # Make Docker builds less verbose
  BUILDKIT_PROGRESS: plain

  # The following images are defined here and their values will be updated by updatecli
  # Please do not change them manually.
  IMAGE_UBUNTU_2404_X86_64: "platform-ingest-elastic-agent-ubuntu-2404-1793494863"
  IMAGE_UBUNTU_2404_ARM_64: "platform-ingest-elastic-agent-ubuntu-2404-aarch64-1793494863"

# This section is used to define the plugins that will be used in the pipeline.
# See https://buildkite.com/docs/pipelines/integrations/plugins/using#using-yaml-anchors-with-plugins
common:
  - google_oidc_plugin: &google_oidc_plugin
      # See https://github.com/elastic/oblt-infra/blob/main/conf/resources/repos/elastic-agent/01-gcp-oidc.tf
      # This plugin authenticates to Google Cloud using the OIDC token.
      elastic/oblt-google-auth#v1.3.1:
        lifetime: 10800 # seconds
        project-id: "elastic-observability-ci"
        project-number: "911195782929"

steps:
  - input: "Build parameters"
    if: 'build.env("DRA_WORKFLOW") == null || build.env("DRA_VERSION") == null'
    fields:
      - text: "MANIFEST_URL"
        key: "MANIFEST_URL"
        default: ""
        required: false
        hint: "Link to the build manifest URL."
      - select: "Mage verbose"
        key: "MAGEFILE_VERBOSE"
        required: "false"
        options:
          - label: "True"
            value: "1"
          - label: "False"
            value: "0"
        hint: "Increase verbosity of the mage commands, defaults to 0"
      - select: "DRA Workflow"
        key: "DRA_WORKFLOW"
        required: "true"
        options:
          - label: "snapshot"
            value: "snapshot"
          - label: "staging"
            value: "staging"
        hint: "What workflow of the DRA release process this build is going to be triggered for"
      - text: "DRA Version"
        key: "DRA_VERSION"
        required: "true"
        default: ""
        hint: "The packaging version to use"
      - select: "DRA DRY-RUN"
        key: "DRA_DRY_RUN"
        required: "false"
        options:
          - label: "True"
            value: "--dry-run"
          - label: "False"
            value: ""
        hint: "If the DRA release manager script would actually publish anything or just print"

  - group: ":Packaging Artifacts"
    key: "package"
    steps:
      - label: ":package: FIPS=false Cross Building and package elastic-agent"
        key: package_elastic-agent
        agents:
          provider: "gcp"
          machineType: "c2-standard-16"
          diskSizeGb: 400
          image: "${IMAGE_UBUNTU_2404_X86_64}"
        env:
          PLATFORMS: "linux/amd64 windows/amd64 darwin/amd64"
          PACKAGES: "all"
          FIPS: "false"
        command: |
          if [[ -z "$${MANIFEST_URL}" ]]; then
            export MANIFEST_URL=$(buildkite-agent meta-data get MANIFEST_URL --default "")
          fi
          if [[ -z "$${MAGEFILE_VERBOSE}" ]]; then
            export MAGEFILE_VERBOSE=$(buildkite-agent meta-data get MAGEFILE_VERBOSE --default "0")
          fi
          .buildkite/scripts/steps/package.sh
        artifact_paths:
          - "build/distributions/**/*"
        plugins:
          - elastic/vault-docker-login#v0.5.2:
              secret_path: 'kv/ci-shared/platform-ingest/elastic_docker_registry'
          - *google_oidc_plugin

      - label: ":package: FIPS=true Cross Building and package elastic-agent"
        key: package_elastic-agent_fips
        agents:
          provider: "gcp"
          machineType: "c2-standard-16"
          diskSizeGb: 400
          image: "${IMAGE_UBUNTU_2404_X86_64}"
        env:
          PLATFORMS: "linux/amd64 windows/amd64 darwin/amd64"
          PACKAGES: "all"
          FIPS: "true"
        command: |
          if [[ -z "$${MANIFEST_URL}" ]]; then
            export MANIFEST_URL=$(buildkite-agent meta-data get MANIFEST_URL --default "")
          fi
          if [[ -z "$${MAGEFILE_VERBOSE}" ]]; then
            export MAGEFILE_VERBOSE=$(buildkite-agent meta-data get MAGEFILE_VERBOSE --default "0")
          fi
          .buildkite/scripts/steps/package.sh
        artifact_paths:
          - "build/distributions/**/*"
        plugins:
          - elastic/vault-docker-login#v0.5.2:
              secret_path: 'kv/ci-shared/platform-ingest/elastic_docker_registry'
          - *google_oidc_plugin

      - label: ":package: FIPS=false Package ARM elastic-agent"
        key: package_elastic-agent_arm
        agents:
          provider: "aws"
          instanceType: "t4g.2xlarge"
          image: "${IMAGE_UBUNTU_2404_ARM_64}"
          diskSizeGb: 400
        env:
          PLATFORMS: "linux/arm64 darwin/arm64 windows/arm64"
          PACKAGES: "all"
          FIPS: "false"
        command: |
          echo "Add support for multiarch"
          docker run --privileged --rm tonistiigi/binfmt:master --install all

          if [[ -z "$${MANIFEST_URL}" ]]; then
            export MANIFEST_URL=$(buildkite-agent meta-data get MANIFEST_URL --default "")
          fi
          if [[ -z "$${MAGEFILE_VERBOSE}" ]]; then
            export MAGEFILE_VERBOSE=$(buildkite-agent meta-data get MAGEFILE_VERBOSE --default "0")
          fi
          .buildkite/scripts/steps/package.sh
          ls -lahR build/
        artifact_paths:
          - "build/distributions/**/*"
        plugins:
          - *google_oidc_plugin

      - label: ":package: FIPS=true Package ARM elastic-agent"
        key: package_elastic-agent_arm_fips
        agents:
          provider: "aws"
          instanceType: "t4g.2xlarge"
          image: "${IMAGE_UBUNTU_2404_ARM_64}"
          diskSizeGb: 400
        env:
          PLATFORMS: "linux/arm64 windows/arm64 darwin/arm64"
          PACKAGES: "docker,tar.gz,deb,rpm,zip"
          FIPS: "true"
        command: |
          echo "Add support for multiarch"
          docker run --privileged --rm tonistiigi/binfmt:master --install all

          if [[ -z "$${MANIFEST_URL}" ]]; then
            export MANIFEST_URL=$(buildkite-agent meta-data get MANIFEST_URL --default "")
          fi
          if [[ -z "$${MAGEFILE_VERBOSE}" ]]; then
            export MAGEFILE_VERBOSE=$(buildkite-agent meta-data get MAGEFILE_VERBOSE --default "0")
          fi
          .buildkite/scripts/steps/package.sh
          ls -lahR build/
        artifact_paths:
          - "build/distributions/**/*"
        plugins:
          - *google_oidc_plugin

  - label: ":elastic-stack: DRA Prep elastic-agent-package"
    # skip for IAR — IAR uses the legacy publish path below
    if: build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") == null || build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") != "independent-agent-release-staging"
    key: dra-prep
    depends_on: package
    # publish only from main and release branches, never from PRs or manually
    # forced feature-branch builds
    command: ".buildkite/scripts/stage-agent-package-artifacts.sh"
    agents:
      image: "docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest"
      cpu: "2"
      memory: "4Gi"
      ephemeralStorage: "20Gi"
    env:
      DRA_PROJECT_ID: "elastic-agent-package"
    plugins:
      - *google_oidc_plugin
      - elastic/dra-prep#v0.1.7:
          product_id: "elastic-agent-package"
          stack_version: "${DRA_VERSION}-SNAPSHOT"
          workflow: "${DRA_WORKFLOW}"

  - label: ":pipeline: DRA processing for elastic-agent-package / ${DRA_VERSION} / ${DRA_WORKFLOW}"
    trigger: "unified-release-dra-processing"
    depends_on: "dra-prep"
    if: build.pull_request.id == null && (build.branch == "main" || build.branch =~ /^[0-9]+\.[0-9x]+\$/)
    build:
      env:
        DRA_PRODUCT_ID: "elastic-agent-package"
        DRA_STACK_VERSION: "${DRA_VERSION}-SNAPSHOT"
        DRA_WORKFLOW: "${DRA_WORKFLOW}"

  - label: "Publishing via BK API for Independent Agent Release"
    if: build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") == "independent-agent-release-staging"
    key: bk-api-publish-independent-agent
    depends_on: package
    agents:
      provider: "gcp"
      machineType: "n2-standard-8"
      diskSizeGb: 400
      image: "${IMAGE_UBUNTU_2404_X86_64}"
    env:
      DRA_PROJECT_ID: "elastic-agent-package"
      DRA_PROJECT_ARTIFACT_ID: "agent-package"
    artifact_paths:
      - "build/distributions/**/*"
    command: |
      echo "+++ Restoring Artifacts"
      buildkite-agent artifact download "build/**/*" .
      echo "+++ Changing permissions for the BK API commands"
      sudo chown -R :1000 build/distributions/
      echo "--- File listing"
      ls -alR build
      echo "+++ Checking artifact validity with release-manager collect dry run"
      DRA_DRY_RUN="--dry-run"
      export DRA_DRY_RUN
      .buildkite/scripts/steps/dra-publish.sh
      # Artifacts will be uploaded via the artifact_paths entry above
      echo "+++ Set job metadata if TRIGGER_JOB_ID is properly set"
      if [[ -z "$${TRIGGER_JOB_ID}" ]]; then
        echo "TRIGGER_JOB_ID is not set, so not setting metadata"
      else
        # If a pipeline that triggered this build passes in a "TRIGGER_JOB_ID" env var, that
        # is an indicator that it will want us to set some metadata in that calling build
        # so that it can reference this specific build ID in order to easily download
        # artifacts saved off in this build.
        #
        # This is a much easier way to pull back artifacts from a triggered build than using
        # a Buildkite token that we then have to manage via vault, etc.
        # See: https://forum.buildkite.community/t/how-to-download-artifacts-back-from-triggered-pipeline/3480/2
        echo "Setting metadata for job that trigger this one"
        buildkite-agent meta-data set "triggered_build_id" "$BUILDKITE_BUILD_ID" --job $TRIGGER_JOB_ID
        buildkite-agent meta-data set "triggered_commit_hash" "$BUILDKITE_COMMIT" --job $TRIGGER_JOB_ID
      fi
    plugins:
      - *google_oidc_plugin

notify:
- slack:
    channels:
      - "#ingest-notifications"
    message: ":traffic_cone: elastic-agent-package failed! <!subteam^S030QSX59PH> please investigate."
  if: build.state == "failed" && (build.branch == 'main' || build.branch =~ /^[0-9]+\.[0-9x]+\$/)

