  - label: ":mag: probe vault-secrets __VERSION__"
    key: "__KEY__"
    command: 'test -n "$${PROBE_SECRET}"'
    agents:
      provider: "gcp"
      image: "${IMAGE_UBUNTU_2204_X86_64}"
    plugins:
      - __PIN__:
          path: 'kv/ci-shared/platform-ingest/buildkite_analytics_token'
          field: 'token'
          env_var: 'PROBE_SECRET'
