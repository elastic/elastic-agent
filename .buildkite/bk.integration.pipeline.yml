  - group: ":kubernetes: Kubernetes (tier 1)"
    key: integration-tests-kubernetes-tier-1
    if: build.pull_request.id != null
    notify:
      - github_commit_status:
          context: "buildkite/elastic-agent-extended-testing - Kubernetes - tier 1"
    depends_on:
      - integration-ess
      - packaging-containers-amd64
    steps:
      - label: "kubernetes:tier1:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *k8s_test_env
        command: *k8s_test_command
        artifact_paths:
          *k8s_test_artifact_paths
        retry:
          automatic:
            limit: 1
        agents:
          *k8s_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *k8s_test_default_variants
            version:
              *k8s_test_versions

      - label: "openshift:tier1:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *openshift_test_env
        command: *openshift_test_command
        artifact_paths:
          *openshift_test_artifact_paths
        # TODO(samuelvl): remove soft_fail once OpenShift tests are stable
        soft_fail: true
        retry:
          automatic:
            limit: 1
        agents:
          *openshift_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *openshift_test_default_variants
            version:
              - *openshift_min_test_version
              - *openshift_max_test_version

  - group: ":kubernetes: Kubernetes (tier 2)"
    key: integration-tests-kubernetes-tier-2
    if_changed:
      include:
        - .buildkite/**
        - magefile.go
        - deploy/**
        - dev-tools/**
        - go.mod
        - go.sum
    notify:
      - github_commit_status:
          context: "buildkite/elastic-agent-extended-testing - Kubernetes - tier 2"
    depends_on:
      - integration-ess
      - packaging-containers-amd64
    steps:
      - label: "kubernetes:tier2:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *k8s_test_env
        command: *k8s_test_command
        artifact_paths:
          *k8s_test_artifact_paths
        retry:
          automatic:
            limit: 1
        agents:
          *k8s_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *k8s_test_variants
            version:
              - *k8s_min_test_version
              - *k8s_max_test_version

      - label: "openshift:tier2:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *openshift_test_env
        command: *openshift_test_command
        artifact_paths:
          *openshift_test_artifact_paths
        # TODO(samuelvl): remove soft_fail once OpenShift tests are stable
        soft_fail: true
        retry:
          automatic:
            limit: 1
        agents:
          *openshift_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *openshift_test_variants
            version:
              - *openshift_min_test_version
              - *openshift_max_test_version

  - group: ":kubernetes: Kubernetes (tier 3)"
    key: integration-tests-kubernetes-tier-3
    # NOTE: as long as we use the scheduler pipeline we need to use BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG.
    #       We use that pipeline to run the tier 3 tests on a schedule for the active branches.
    if: build.source == "schedule" || build.env("BUILDKITE_TRIGGERED_FROM_BUILD_PIPELINE_SLUG") == "elastic-agent-pipeline-scheduler"
    notify:
      - github_commit_status:
          context: "buildkite/elastic-agent-extended-testing - Kubernetes - tier 3"
    depends_on:
      - integration-ess
      - packaging-containers-amd64
    steps:
      - label: "kubernetes:tier3:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *k8s_test_env
        command: *k8s_test_command_with_sleep
        artifact_paths:
          *k8s_test_artifact_paths
        retry:
          automatic:
            limit: 1
        agents:
          *k8s_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *k8s_test_variants
            version:
              *k8s_test_versions_without_min_max

      - label: "openshift:tier3:{{matrix.version}}:amd64:{{matrix.variants}}"
        env:
          *openshift_test_env
        command: *openshift_test_command
        artifact_paths:
          *openshift_test_artifact_paths
        # TODO(samuelvl): remove soft_fail once OpenShift tests are stable
        soft_fail: true
        retry:
          automatic:
            limit: 1
        agents:
          *openshift_test_agent
        plugins:
          - *google_oidc_observability_plugin
          - *oblt_cli_plugin
          - *vault_github_token
        matrix:
          setup:
            variants:
              *openshift_test_variants
            version:
              *openshift_test_versions_without_min_max

