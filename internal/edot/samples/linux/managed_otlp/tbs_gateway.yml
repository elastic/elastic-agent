receivers:
  # Receives data from other Collectors in Agent mode
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317 # Listen on all interfaces
      http:
        endpoint: 0.0.0.0:4318 # Listen on all interfaces

connectors:
  elasticapm: {} # Elastic APM Connector
  forward: # Forward connector necessary for tail-based sampling

processors:
  batch:
    send_batch_size: 1000
    timeout: 1s
    send_batch_max_size: 1500
  batch/metrics:
    send_batch_max_size: 0 # Explicitly set to 0 to avoid splitting metrics requests
    timeout: 1s
  elasticapm: {} # Elastic APM Processor
  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
      [
        {
          name: latency-5000ms-10000ms,
          type: latency,
          latency: {threshold_ms: 5000, upper_threshold_ms: 10000}
        }
      ]

exporters:
  debug: {}
  otlp_grpc/motlp-aggregated:
    endpoint: ${env:ELASTIC_OTLP_ENDPOINT}
    headers:
      Authorization: ApiKey ${env:ELASTIC_API_KEY}
      x-elastic-apm-aggregation-processed: "true"
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000 # 50MB uncompressed
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        min_size: 1_000_000 # 1MB uncompressed
        max_size: 4_000_000 # 4MB uncompressed

service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch/metrics, elasticapm ]
      exporters: [ debug, elasticapm, otlp_grpc/motlp-aggregated ]
    logs:
      receivers: [ otlp ]
      processors: [ batch, elasticapm ]
      exporters: [ debug, elasticapm, otlp_grpc/motlp-aggregated ]
    traces/1-process-elastic:
      receivers: [ otlp ]
      processors: [ batch, elasticapm ]
      exporters: [ debug, elasticapm, forward ]
    traces/2-process-tbs:
      receivers: [ forward ]
      processors: [ tail_sampling ]
      exporters: [ debug, otlp_grpc/motlp-aggregated ]
    metrics/aggregated-otel-metrics:
      receivers:
        - elasticapm
      processors: []
      exporters:
        - debug
        - otlp_grpc/motlp-aggregated
