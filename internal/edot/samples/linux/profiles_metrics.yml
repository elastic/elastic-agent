receivers:
  profiling:
    samples_per_second: 19

connectors:
  profilingmetrics:

exporters:
  # OTLP/HTTP exporter sending metrics to Elasticsearch's native OTLP endpoint.
  # Elasticsearch exposes OTLP over HTTP only (no gRPC) at <es_endpoint>/_otlp.
  # The exporter appends the signal path (/v1/metrics) to the configured endpoint.
  otlp_http/ingest_metrics:
    endpoint: ${env:ELASTIC_ENDPOINT}/_otlp
    headers:
      Authorization: ApiKey ${env:ELASTIC_API_KEY}
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000 # 50MB uncompressed
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        min_size: 1000000 # 1MB uncompressed
        max_size: 4000000 # 4MB uncompressed
    timeout: 15s

service:
  pipelines:
    profiles:
      receivers: [ profiling ]
      exporters: [ profilingmetrics ]
    metrics:
      receivers: [ profilingmetrics ]
      exporters: [ otlp_http/ingest_metrics ]
