type: awsidentityfederation
scope_name: github.com/elastic/elastic-agent/internal/edot/extensions/awsidentityfederationextension
github_project: elastic/elastic-agent

description: |
  This extension resolves AWS credentials for the Identity Federation flow of Elastic
  managed integrations. It fetches a JWT from the Elastic workload-identity-issuer over
  mTLS and assumes the customer's IAM role with sts:AssumeRoleWithWebIdentity, then shares
  the credentials with AWS-SDK-based components (for example the awscloudwatch receiver)
  through their credentials_provider option.

status:
  class: extension
  stability:
    development: [extension]
  distributions: []
  codeowners:
    active: [jeniawhite]

tests:
  config:
    role_arn: arn:aws:iam::123456789012:role/ElasticWorkloadIdentity-test
    sts_region: us-east-1
    issuer_url: https://workload-identity-issuer-internal.us-east-1.aws.svc.elastic.cloud
    cert_file: /nonexistent/wii-client.crt
    key_file: /nonexistent/wii-client.key
