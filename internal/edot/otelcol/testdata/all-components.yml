exporters:
  debug:
  elasticsearch:
    endpoints:
      - http://localhost:9200
  file:
    path: /tmp/file-exporter-output.json
  otlp_grpc:
    endpoint: localhots:4317
  otlp_http:
    endpoint: https://localhost.com:4318
  nop:

extensions:
  health_check:
  memory_limiter:
    check_interval: 5s
    limit_mib: 100
  headers_setter:
    headers:
      - action: insert
        key: X-Scope-OrgID
        from_context: tenant_id
        default_value: Org-ID
  azure_auth:
    use_default: true
  azure_encoding:

processors:
  attributes:
    actions:
      - action: insert
        key: key1
        value: value1
  batch:
  cumulative_to_delta:
  elasticinframetrics:
  filter:
  resource:
    attributes:
      - action: insert
        key: key1
        value: value1
  resource_detection:
  transform:
  memory_limiter/processor:
    check_interval: 1s
    limit_mib: 4000
    spike_limit_mib: 800
  elastictrace:

receivers:
  nop:
  file_log:
    include:
      - /filelog/path
  otlp:
    protocols:
      grpc:
      http:
  http_check:
    targets:
      - endpoint: http://localhost:80
        method: GET
    collection_interval: 10s
  jaeger:
    protocols:
      grpc:
  zipkin:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 5s
          static_configs:
            - targets: ['0.0.0.0:8888']
  azuremonitor:
    subscription_ids:
      - 00000000-0000-0000-0000-000000000000
    cloud: AzureCloud
    credentials: default_credentials

connectors:
  span_metrics:
    histogram:
      explicit:
        buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms]
    dimensions:
      - name: http.method
        default: GET
      - name: http.status_code
    exemplars:
      enabled: true
    exclude_dimensions: ['status.code']
    dimensions_cache_size: 1000
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    events:
      enabled: true
      dimensions:
        - name: exception.type
        - name: exception.message
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name
  elasticapm:
  forward:

service:
  extensions:
    - memory_limiter
    - health_check
    - headers_setter
    - azure_auth
    - azure_encoding
  pipelines:
    logs:
      exporters:
        - nop
        - debug
        - elasticsearch
        - file
        - otlp_grpc
      processors:
        - attributes
        - batch
        - filter
        - resource
        - resource_detection
        - transform
        - memory_limiter/processor
      receivers:
        - file_log
        - otlp
        - nop

    logs/forward_receive:
      receivers:
        - nop
      exporters:
        - forward

    logs/forward_export:
      receivers:
        - forward
      exporters:
        - nop

    metrics:
      exporters:
        - nop
        - debug
        - otlp_grpc
      processors:
        - attributes
        - batch
        - cumulative_to_delta
        - elasticinframetrics
        - filter
        - resource
        - resource_detection
        - transform
      receivers:
        - nop
        - otlp
        - http_check
        - span_metrics
        - prometheus
        - azuremonitor

    metrics/aggregated:
      receivers:
        - elasticapm
      processors:
      exporters:
        - debug
        - otlp_grpc

    traces:
      exporters:
        - nop
        - debug
        - elasticsearch
        - otlp_grpc
        - otlp_http
        - span_metrics
        - elasticapm
      processors:
        - attributes
        - batch
        - filter
        - resource
        - resource_detection
        - transform
        - elastictrace
      receivers:
        - nop
        - otlp
        - jaeger
        - zipkin
