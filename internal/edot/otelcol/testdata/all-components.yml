    headers:
      - action: insert
        key: X-Scope-OrgID
        from_context: tenant_id
        default_value: Org-ID
  azure_auth:
    use_default: true
  azure_encoding:

processors:
  attributes:
    actions:
      - action: insert
        key: key1
        value: value1
  batch:
  cumulative_to_delta:
  elasticinframetrics:
  filter:
  resource:
    attributes:
      - action: insert
        key: key1
        value: value1
  resource_detection:
  transform:
  memory_limiter/processor:
    check_interval: 1s
    limit_mib: 4000
    spike_limit_mib: 800
  elastictrace:

receivers:
  nop:
  file_log:
    include:
      - /filelog/path
  otlp:
    protocols:
      grpc:
      http:
  http_check:
    targets:
      - endpoint: http://localhost:80
        method: GET
    collection_interval: 10s
  jaeger:
    protocols:
      grpc:
  zipkin:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 5s
          static_configs:
            - targets: ['0.0.0.0:8888']
