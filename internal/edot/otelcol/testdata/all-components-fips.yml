exporters:
  debug:
  elasticsearch:
    endpoints:
      - http://localhost:9200
  file:
    path: /tmp/file-exporter-output.json
  otlp_grpc:
    endpoint: localhots:4317
  otlp_http:
    endpoint: https://localhost.com:4318

extensions:
  health_check:
  memory_limiter:
    check_interval: 5s
    limit_mib: 100

processors:
  attributes:
    actions:
      - action: insert
        key: key1
        value: value1
  batch:
  cumulative_to_delta:
  elasticinframetrics:
  filter:
  resource:
    attributes:
      - action: insert
        key: key1
        value: value1
  resource_detection:
  transform:
  memory_limiter/processor:
    check_interval: 1s
    limit_mib: 4000
    spike_limit_mib: 800
  elasticapm:
  ratelimit:
    rate: 1
    burst: 1
  tail_sampling:
  beat:

receivers:
  file_log:
    include:
      - /filelog/path
  otlp:
    protocols:
      grpc:
      http:
  http_check:
    targets:
      - endpoint: http://localhost:80
        method: GET
    collection_interval: 10s
  jaeger:
    protocols:
      grpc:
  zipkin:
  docker_stats:
  elasticmonitoringreceiver:
  verifier:
    identity_federation_id: "test-cc-001"
    verification_id: "test-verify-001"
    policies:
      - policy_id: "policy-001"
        integrations:
          - policy_template: "cloudtrail"
            package_name: "aws"

connectors:
  span_metrics:
    histogram:
      explicit:
        buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms]
    dimensions:
      - name: http.method
        default: GET
      - name: http.status_code
    exemplars:
      enabled: true
    exclude_dimensions: ['status.code']
    dimensions_cache_size: 1000
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    events:
      enabled: true
      dimensions:
        - name: exception.type
        - name: exception.message
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name
  elasticapm:

service:
  extensions:
    - memory_limiter
    - health_check
  pipelines:
    logs:
      exporters:
        - debug
        - elasticsearch
        - file
        - otlp_grpc
      processors:
        - attributes
        - batch
        - filter
        - resource
        - resource_detection
        - transform
        - memory_limiter/processor
      receivers:
        - file_log
        - otlp
        - verifier

    metrics:
      exporters:
        - debug
        - otlp_grpc
      processors:
        - attributes
        - batch
        - cumulative_to_delta
        - elasticinframetrics
        - filter
        - resource
        - resource_detection
        - transform
      receivers:
        - otlp
        - http_check
        - span_metrics
        - elasticmonitoringreceiver

    metrics/aggregated:
      receivers:
        - elasticapm
      processors:
      exporters:
        - debug
        - otlp_grpc

    traces:
      exporters:
        - debug
        - elasticsearch
        - otlp_grpc
        - otlp_http
        - span_metrics
        - elasticapm
      processors:
        - attributes
        - batch
        - filter
        - resource
        - resource_detection
        - transform
        - elasticapm
      receivers:
        - otlp
        - jaeger
        - zipkin

