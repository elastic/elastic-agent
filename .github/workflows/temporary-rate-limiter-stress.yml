name: temporary-rate-limiter-stress

on:
  pull_request:
    paths:
      - .github/workflows/temporary-rate-limiter-stress.yml

permissions:
  contents: read

jobs:
  stress-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Run TestAddToBucket 10,000 times
        run: go test ./pkg/component/runtime -run '^TestAddToBucket$' -count=10000 -timeout=5m
