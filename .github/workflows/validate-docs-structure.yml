name: Validate docs generation structure

on:
  pull_request:
    paths:
      - 'internal/edot/**'
      - 'docs/scripts/update-docs/**'
      - '.github/workflows/validate-docs-structure.yml'

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0  # Fetch all history including tags (needed for the docs drift check)

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/elastic/elastic-agent.git || true
          git fetch upstream --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      
      - name: Install mage
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          install-only: true
      
      - name: Validate expected files for docs generation
        run: mage check:docsFiles

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/scripts/update-docs/requirements.txt

      - name: Run docs generator unit tests
        run: |
          cd docs/scripts/update-docs
          python test_update_components_docs.py

      - name: Check generated docs are up to date
        run: |
          cd docs/scripts/update-docs
          python update-components-docs.py check

