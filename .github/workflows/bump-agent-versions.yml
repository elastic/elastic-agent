---
name: update-agent-versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.generator.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - id: generator
        uses: elastic/oblt-actions/elastic/active-branches@v1
        with:
          filter-branches: true

  update_versions:
    runs-on: ubuntu-latest
    needs: [filter]
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      matrix: ${{ fromJson(needs.filter.outputs.matrix) }}
    steps:
      # Mint before checkout so push/gh pr create use the Vault app (not GITHUB_TOKEN /
      # github-actions[bot]), avoiding Approve-and-run on the opened PRs.
      - name: Create ephemeral GitHub token
        id: github-token
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          # Wildcard policy bump-*.yml@* (catalog token-policy-7821ae69db47)
          token-policy: token-policy-7821ae69db47

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          ref: "${{ matrix.branch }}"
          token: ${{ steps.github-token.outputs.token }}

          # no depth limit
          # so, we can generate snapshot versions based on release branches
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set git config
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Install mage
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: v1.14.0
          install-only: true

      - name: Update versions
        id: update
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
        run: ./.github/workflows/bump-agent-versions.sh

      - if: ${{ failure()  }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#ingest-notifications",
              "text": "${{ env.SLACK_MESSAGE }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ env.SLACK_MESSAGE }}"
                  }
                }
              ]
            }
        env:
          SLACK_MESSAGE: ":traffic_cone: Elastic Agent version update failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # if a PR was created as a result of this job, we notify on the Slack channel
      - if: ${{ startsWith(steps.update.outputs.pr, 'https') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#ingest-notifications",
              "text": "${{ env.SLACK_MESSAGE }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ env.SLACK_MESSAGE }}"
                  }
                }
              ]
            }
        env:
          SLACK_MESSAGE: "Update for Elastic Agent versions has been created: ${{ steps.update.outputs.pr }}"
