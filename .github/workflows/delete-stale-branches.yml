name: delete-stale-branches

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the branches that would be deleted without deleting them'
        type: boolean
        default: true
      stale_months:
        description: 'Delete branches whose last commit is older than this many months'
        type: string
        default: '12'

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-stale-branches:
    if: github.repository == 'elastic/elastic-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/delete-stale-branches.sh
          sparse-checkout-cone-mode: false

      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_MONTHS: ${{ inputs.stale_months || '12' }}
          # Scheduled runs delete; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: .github/workflows/delete-stale-branches.sh
