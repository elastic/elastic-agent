# `@metadata` is an internal field in Logstash, so we need to rename it to `metadata`
# in order for it to be visible for comparison.

- pipeline.id: fb
  pipeline.workers: 1
  pipeline.ordered: true
  config.string: |
    input {
      beats {
        id => "fb_classic"
        port => "5044"
        enrich => "none"
        ssl_enabled => false
      }
      beats {
        id => "fb_otel"
        port => "5055"
        enrich => "none"
        ssl_enabled => false
      }
    }
    filter {
      mutate {
        rename => ["@metadata", "metadata"]
      }
    }
    output {
      file {
        path => "/usr/share/logstash/testdata/%{testcase}.json"
      }
    }
